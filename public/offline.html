<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#106953" />
    <title>Hors ligne · BDE</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #172033;
      }
      .card {
        max-width: 28rem;
        border: 1px solid #e6eaf0;
        border-radius: 1.25rem;
        background: #fff;
        padding: 2rem;
        box-shadow: 0 8px 30px rgba(23, 32, 51, 0.08);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.9rem;
        background: #106953;
        color: #fff;
        font-weight: 900;
        font-size: 0.8rem;
      }
      h1 { margin: 1.25rem 0 0.5rem; font-size: 1.5rem; }
      p { line-height: 1.6; color: #526070; }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.7rem 1rem;
        border-radius: 0.75rem;
        background: #106953;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">BDE</span>
      <h1>Tu es hors ligne</h1>
      <p>
        Cette page n’est pas disponible sans connexion internet. Les pages déjà consultées
        peuvent rester accessibles. Réessaie dès que le réseau revient.
      </p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
